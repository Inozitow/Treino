<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Treino</title>
<style>
:root{--bg:#000;--s1:#130f1d;--s2:#1e1733;--ln:#2e2447;--p:#9b5cff;--p2:#c9a8ff;--tx:#f2edfb;--mut:#8f86a8;--bad:#ff6b8a;--ok:#34d399;--red:#e5384f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,Roboto,sans-serif}
body{padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ln)}
header b{font-size:20px;font-weight:800}
#clock{font-size:22px;font-weight:800;color:var(--p2);font-variant-numeric:tabular-nums}
main{padding:6px 14px}
h2{font-size:22px;font-weight:800;margin:16px 0 10px}
h3{font-size:18px;margin:0}
.mut,small{color:var(--mut)}
.chips,.row{display:flex;gap:8px}
.chips{overflow-x:auto;padding:8px 0}
.row{margin:10px 0}.row>*{flex:1}
button,select,textarea,input{font:inherit;color:var(--tx)}
.chip,.ghost,#rest button,select{border:1px solid var(--ln);background:var(--s1);border-radius:12px;padding:10px 14px;min-height:46px}
.chip.on,#rest button.on{background:var(--p);border-color:var(--p);color:#000;font-weight:700}
.big{display:block;width:100%;background:var(--p);color:#000;font-weight:800;font-size:18px;min-height:58px;border:0;border-radius:16px;margin:14px 0}
.btn{display:flex;align-items:center;justify-content:center;text-align:center}
.arm{background:var(--bad)!important;color:#000!important;border-color:var(--bad)!important}
.plan{list-style:none;padding:0;margin:0}
.plan li{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--ln)}
.plan b{color:var(--p2)}
.ex{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:14px;margin:12px 0}
.ex.done{border-color:var(--p)}
.exh{display:flex;justify-content:space-between;align-items:center}
.tag{color:var(--p2);font-size:14px;font-weight:700}
.prev{margin:4px 0 10px;font-size:14px;color:var(--mut)}
.set{display:flex;gap:8px;align-items:center;margin:8px 0}
.set .n{width:20px;text-align:center;color:var(--mut);font-weight:700}
label{flex:1;position:relative;display:block}
label input{width:100%;height:50px;border-radius:10px;border:1px solid var(--ln);background:#000;text-align:center;font-size:22px;font-weight:700;padding:0 28px 0 8px;font-variant-numeric:tabular-nums}
label input::placeholder{color:#4b4166;font-weight:500}
label input:focus,textarea:focus{outline:2px solid var(--p);border-color:var(--p)}
label u{position:absolute;right:8px;top:50%;transform:translateY(-50%);text-decoration:none;color:var(--mut);font-size:12px;pointer-events:none}
.chk{width:54px;height:50px;border-radius:14px;border:1px solid var(--ln);background:#000;color:var(--mut);font-size:24px}
.chk.on{background:var(--p);border-color:var(--p);color:#000}
textarea{width:100%;background:#000;border:1px solid var(--ln);border-radius:10px;padding:10px;resize:vertical;margin:6px 0}
select{width:100%}
.warn{background:var(--s2);border-radius:14px;padding:12px;margin:10px 0}
.warn button{background:none;border:0;color:var(--p2);font-weight:700;padding:0;text-decoration:underline}
.ses{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin:10px 0}
.ses summary{display:flex;flex-direction:column;cursor:pointer}
.hx{padding:10px 0;border-bottom:1px solid var(--ln)}
.hx div{font-variant-numeric:tabular-nums;color:var(--p2)}
.hx i{display:block;color:var(--mut)}
.chart{width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:16px;margin:10px 0}
.pr{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ln)}
.pr b{color:var(--p2)}
#rest{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));background:var(--s2);border-top:1px solid var(--p);padding:8px 10px;display:flex;gap:6px;align-items:center;overflow-x:auto;z-index:6}
#rest .rt{font-size:30px;font-weight:800;color:var(--p2);font-variant-numeric:tabular-nums;margin-right:auto}
#rest button{flex:none;padding:8px 12px;min-height:42px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#000;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:7}
nav button{flex:1;height:60px;background:none;border:0;border-top:3px solid transparent;color:var(--mut);font-size:13px}
nav button.on{color:var(--p2);border-top-color:var(--p);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;background:var(--p);color:#000;font-weight:700;padding:10px 16px;border-radius:12px;z-index:9}

.fl{flex:none;width:42px;display:flex;flex-direction:column;align-items:center;gap:2px}
.fl input{width:22px;height:22px;accent-color:var(--p)}
.fl small{font-size:11px}
.ev{display:flex;gap:6px;margin:-2px 0 10px 28px}
.ev select{flex:1;min-width:0;min-height:40px;padding:6px 8px;font-size:14px}
.sg{color:var(--p2)}
.ctr{text-align:center}
.nav b{align-self:center;font-size:17px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0}
.cg small{color:var(--mut);font-size:12px}
.dc{aspect-ratio:1;border-radius:12px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;line-height:1.1}
.dc small{font-size:10px;min-height:11px;color:inherit;opacity:.9}
.dc.nt{background:#0b0b0b;border-color:#161616;color:#444}
.dc.rest{background:#3a3a3a;border-color:#3a3a3a;color:#c4c4c4}
.dc.pend{background:#000;border-color:var(--ok)}
.dc.ok{background:#2d1a5e;border-color:var(--ok)}
.dc.miss{background:var(--red);border-color:var(--red);color:#000}
.dc.cd{box-shadow:inset 0 -4px 0 var(--p)}
.dc.today{outline:2px solid var(--p2);outline-offset:1px}
.mini{gap:2px}.mini .dc{border-radius:4px;border-width:1px;box-shadow:none}.mini .dc.cd{box-shadow:inset 0 -2px 0 var(--p)}
.yg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mm{display:flex;flex-direction:column;gap:4px}.mm small{color:var(--mut);font-size:11px}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);margin:14px 0}
.lg .dc{display:inline-flex;width:16px;height:16px;aspect-ratio:auto;border-radius:5px;margin-right:5px;vertical-align:middle}
.skr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.sk{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;text-align:center}
.sk b{font-size:28px;color:var(--p2)}.sk span{font-size:12px}.sk small{font-size:11px;color:var(--mut)}
.wr{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:12px;margin:6px 0;border:2px solid var(--ln)}
.wr.g{background:#0f3d2a;border-color:var(--ok)}.wr.r{background:#4a1520;border-color:var(--red)}
#cdt{width:100%;background:#000;border:1px solid var(--ln);border-radius:10px;padding:0 10px;min-height:50px;font-size:17px}
.big:disabled{opacity:.4}
.chips.w{flex-wrap:wrap}
.sm{min-height:40px;padding:6px 12px}
button:disabled{opacity:.5}
.bx .row{margin:8px 0 0}.sc{align-self:center;text-align:center}
.set .n.aq{color:var(--p2);font-size:12px}
.set.w label input{border-style:dashed}
.sd{flex:none;width:40px;height:46px;border-radius:10px;border:1px solid var(--p);background:#000;color:var(--p2);font-weight:800}
.tw{flex:none;min-width:118px;font-variant-numeric:tabular-nums;padding:8px}
.cw{display:flex;gap:8px;align-items:center;margin:10px 0}.cw b{font-size:30px;font-variant-numeric:tabular-nums;color:var(--p2);margin-right:auto}
.ev .chip{flex:1}
</style>
</head>
<body>
<header><b id="ttl">Treino</b><span style="display:flex;gap:10px;align-items:center"><button id="pipb" class="ghost sm" data-a="pip" hidden>Janela</button><span id="clock"></span></span></header>
<main id="app"></main>
<div id="rest" hidden></div>
<nav>
<button data-a="tab" data-v="t">Treino</button>
<button data-a="tab" data-v="c">Calendário</button>
<button data-a="tab" data-v="h">Histórico</button>
<button data-a="tab" data-v="p">Progresso</button>
<button data-a="tab" data-v="a">Ajustes</button>
</nav>
<div id="toast" hidden></div>
<script>
const $=(s,e=document)=>e.querySelector(s);
const DAYS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'],ORDER=[1,2,3,4,5,6,0];
// Formato: nome | séries | t (t = exercício de tempo, em segundos). Repetições são lançadas na hora do treino.
const LEG={
2:['Crucifixo reto na polia|3','Supino inclinado com halteres|3','Supino inclinado na máquina|3','Crucifixo na polia de cima para baixo|3','Voador (peck deck)|3','Rosca direta com barra W|3','Rosca Scott unilateral com halter|3','Rosca inclinada com halteres|3','Abdominal infra na cadeira romana|3'],
4:['Cadeira flexora|3','Stiff com barra|3','Mesa flexora|3','Panturrilha sentada|5','Prancha lateral (por lado)|3|t'],
5:['Remada baixa com triângulo|3','Puxador frente|3','Puxada unilateral na máquina|3','Remada curvada com barra|3','Tríceps francês com corda na polia|3','Paralela na máquina|3','Tríceps pulley com barra|3','Prancha convencional|3|t'],
6:['Agachamento livre|3','Agachamento hack|3','Cadeira extensora|3','Cadeira adutora|3','Abdominal supra|3','Panturrilha em pé|5'],
0:['Desenvolvimento com halteres|3','Elevação lateral com triângulo na polia|3','Crucifixo inverso na máquina|3','Elevação frontal com halteres|3','Encolhimento de ombros com halteres|3','Rosca martelo|3','Rosca inversa com barra ou halteres|3','Flexão de punho|3','Extensão de punho|3','Prancha lateral (por lado)|3|t']};
const parse=l=>{const[n,s,t]=l.split('|').map(x=>x.trim());return{n,s:Math.max(1,+s||3),t:t==='t'}};
const toText=a=>a.map(e=>e.n+' | '+e.s+(e.t?' | t':'')).join('\n');
let S;try{S=JSON.parse(localStorage.getItem('gym.v1'))}catch(e){}
if(!S||!S.plan){S={plan:{},sessions:[],active:null,rest:90,restEnd:null,lastBackup:null,pv:3};for(let d=0;d<7;d++)S.plan[d]=[]}
if(S.restEnd&&S.restEnd<=Date.now()){recRest((S.restEnd-(S.restStart||S.restEnd))/1000);S.restEnd=null}
const D0=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mon=d=>{const x=D0(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
S.cl=S.cl||{};S.goals=S.goals||{};
if(!S.trk){const f=S.sessions[0];S.trk=D0(f?f.start:Date.now()).getTime()}
if(S.pv==null||S.pv<2){for(let d=0;d<7;d++)S.plan[d]=(LEG[d]||[]).map(parse);S.pv=3;localStorage.setItem('gym.v1',JSON.stringify(S))}
let tab='t',selDay=new Date().getDay(),planDay=selDay,progEx='',progMet='kg',openId=null,cv='s',wOff=0,mOff=0,yOff=0,cdd='',xt='plan',xg=0;
const save=()=>localStorage.setItem('gym.v1',JSON.stringify(S));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>parseFloat(String(v).replace(',','.'))||0;
const fd=t=>new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','');
const p2=x=>String(x).padStart(2,'0');
const fdur=ms=>{let s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;return(h?h+':':'')+p2(m)+':'+p2(s)};
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,1800)};

function st(it){let kg=0,rk=0,vol=0,reps=0;for(const s of it.sets){if(s.w)continue;const k=num(s.kg),r=num(s.r);if(k>kg||(k===kg&&r>rk)){kg=k;rk=r}vol+=k*r;if(r>reps)reps=r}return{kg,rk,vol:it.t?0:vol,reps}}
const setTxt=it=>it.sets.filter(s=>s.r||s.kg).map(s=>(s.w?'aq ':'')+(it.u&&s.sd?s.sd+' ':'')+(it.t?`${s.r||'–'}s`:`${s.kg||'–'}×${s.r||'–'}`)+(s.f?'✱':'')).join(' · ');
function prevItem(name,before){for(let i=S.sessions.length-1;i>=0;i--){const ss=S.sessions[i];if(before&&ss.id>=before)continue;const it=ss.items.find(x=>x.n===name&&x.sets.some(s=>!s.w&&(s.r||s.kg)));if(it)return{it,ss}}return null}
function delta(a,b){const x=st(a),y=st(b),o=[];const f=(v,u)=>(v>0?'+':v<0?'−':'')+Math.abs(Math.round(v*10)/10)+u;
if(a.t){if(x.reps!==y.reps)o.push('tempo '+f(x.reps-y.reps,' s'))}
else{if(x.kg!==y.kg)o.push('carga máx '+f(x.kg-y.kg,' kg'));if(x.reps!==y.reps)o.push('reps máx '+f(x.reps-y.reps,''));if(x.vol!==y.vol)o.push('volume '+f(x.vol-y.vol,''))}
return 'Vs. treino anterior: '+(o.join(' · ')||'igual')}
const cardioTxt=c=>c&&c.tipo?`Cardio: ${c.tipo}${c.tipo==='Corrida'?` (${c.local}, ${c.int})`:''}${c.min?' · '+esc(c.min)+' min':''}`:'';
const opts=(arr,v)=>arr.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('');

/* ---------- Avaliação e sugestão ---------- */
const EV=[['ex','Execução',['1','2','3','4','5']],['pw','Peso',['Leve','Adequado','Pesado']],['cd','Cadência',['1','2','3','4','5']]];
const norm=v=>+v||({Ruim:2,Boa:4,'Ótima':5}[v]||0);
const isPL=it=>/prancha lateral/i.test(it.n);
const uniOf=n=>/unilateral|por lado|alternad|concentrad|búlgaro|afundo|passada|coice/i.test(n);
const mkItem=(n,t,s,u)=>({n,t:!!t,u:!!u,p:s,obs:'',done:false,sets:(u?['D','E']:['']).flatMap(sd=>Array.from({length:s},()=>sd?{kg:'',r:'',ok:false,sd}:{kg:'',r:'',ok:false}))});
const evRow=(i,j,s,it)=>`<div class="ev">${EV.filter(([k])=>!it.t||k==='ex').map(([k,l,o])=>`<select data-f="ev" data-k="${k}" data-i="${i}" data-j="${j}"><option value="">${l}</option>${o.map(x=>`<option ${s[k]===x?'selected':''}>${x}</option>`).join('')}</select>`).join('')}</div>`;
const sideRow=(i,j,s)=>`<div class="ev"><small class="sc">Lado</small>${[['D','Direito'],['E','Esquerdo']].map(([v,l])=>`<button class="chip ${s.sd===v?'on':''}" data-a="sidepl" data-i="${i}" data-j="${j}" data-v="${v}">${l}</button>`).join('')}</div>`;
function setRow(it,i,j,s,pw){
const K=x=>it.u?x.sd:'',idx=it.sets.slice(0,j).filter(x=>!x.w&&K(x)===K(s)).length,q=s.w?{}:(pw.filter(x=>K(x)===K(s))[idx]||{}),pl=isPL(it),wn=it.sets.slice(0,j).filter(x=>!x.w).length,at=`data-i="${i}" data-j="${j}"`;
const lab=s.w?'<span class="n aq">Aq</span>':(it.u&&!pl?`<button class="sd" data-a="side" ${at}>${s.sd||'D'}${idx+1}</button>`:`<span class="n">${it.u?idx+1:wn+1}</span>`);
const inp=it.t?`<label><input data-f="r" ${at} inputmode="numeric" placeholder="${esc(q.r||'seg')}" value="${esc(s.r)}"><u>seg</u></label><button class="ghost tw" data-a="${s.ts?'tstop':'tstart'}" ${at}>${s.ts?`■ <span data-ts="${s.ts}">${fdur(Date.now()-s.ts)}</span>`:'▶ Cronometrar'}</button>`
:`<label><input data-f="kg" ${at} inputmode="decimal" placeholder="${esc(q.kg||'kg')}" value="${esc(s.kg)}"><u>kg</u></label><label><input data-f="r" ${at} inputmode="numeric" placeholder="${esc(q.r||'reps')}" value="${esc(s.r)}"><u>reps</u></label>`;
const fl=it.t||s.w?'':`<div class="fl"><input type="checkbox" data-f="fl" ${at} ${s.f?'checked':''} aria-label="Falha muscular"><small>falha</small></div>`;
return`<div class="set ${s.w?'w':''}">${lab}${inp}${fl}<button class="chk ${s.ok?'on':''}" data-a="ok" ${at} aria-label="Concluir série">✓</button></div>`+(s.w?'':pl?sideRow(i,j,s):s.ok?evRow(i,j,s,it):'')}
const evTxt=it=>{const W=it.sets.filter(s=>!s.w),o=EV.map(([k,l])=>{const v=W.filter(s=>s[k]).map(s=>s[k]);return v.length?l+': '+v.join(', '):''}).filter(Boolean);
const f=W.map((s,i)=>s.f?i+1:0).filter(Boolean);if(f.length)o.push('falha na'+(f.length>1?'s séries ':' série ')+f.join(', '));
const r=it.sets.filter(s=>s.rest).map(s=>s.rest+'s');if(r.length)o.push('descansos: '+r.join(', '));
return o.length?`<small>${o.join(' · ')}</small>`:''};
function sug(it,pv){
if(isPL(it))return'';
const W=it.sets.filter(s=>!s.w),ok=W.filter(s=>s.ok),pl=(it.p||W.length)*(it.u?2:1);if(!ok.length)return'';
const rt=ok.filter(s=>s.ex&&(it.t||(s.pw&&s.cd)));
if(rt.length<Math.max(2,Math.ceil(pl/2)))return'Poucas séries avaliadas: mantenha a carga e avalie as séries para receber uma sugestão.';
const c=v=>rt.filter(s=>s.pw===v).length,fl=ok.filter(s=>s.f).length,ruim=rt.filter(s=>norm(s.ex)<=2).length,cr=rt.filter(s=>s.cd&&norm(s.cd)<=2).length,avg=rt.reduce((x,s)=>x+norm(s.ex),0)/rt.length,pes=c('Pesado'),leve=c('Leve'),full=ok.length>=pl,h=Math.ceil(rt.length/2);
const a=st(it),b=pv&&st(pv),reg=!!b&&a.reps<b.reps&&a.kg<=b.kg;
if(ruim>=2||(pes>=h&&(ruim>0||fl>=2)))return'Reduzir: baixe a carga em cerca de 5–10% (ou 1–2 repetições) e priorize a execução.';
if(!it.t&&full&&!reg&&ruim===0&&cr===0&&avg>=4&&pes===0&&fl===0&&leve>=h)return'Aumentar a carga em um passo pequeno (cerca de 2,5–5%): execução, cadência e peso indicam folga.';
if(full&&!reg&&ruim===0&&pes===0&&fl<=1)return it.t?'Manter e tentar alguns segundos a mais.':'Manter a carga e tentar +1 repetição por série antes de subir o peso.';
return'Manter a carga e melhorar execução e cadência antes de subir.'}
const cwElapsed=a=>a.cw?a.cw.acc+(a.cw.run?Date.now()-a.cw.ts:0):0;
const cwHtml=A=>{const w=A.cw||{run:false,acc:0};return`<div class="cw"><b id="cwt">${fdur(cwElapsed(A))}</b><button class="ghost" data-a="${w.run?'cpause':'cstart'}">${w.run?'⏸ Pausar':(w.acc?'▶ Retomar':'▶ Iniciar')}</button><button class="ghost" data-a="cfin" data-c="Toque de novo para finalizar" ${w.run||w.acc?'':'disabled'}>■ Finalizar</button></div>`};
function cfinal(A){const w=A.cw;if(!w||(!w.run&&!w.acc))return 0;const ms=cwElapsed(A);A.cw={run:false,acc:0,ts:0};const m=Math.round(ms/6000)/10;if(m<=0)return 0;A.cardio.min=String(Math.round((num(A.cardio.min)+m)*10)/10);(A.cardio.log=A.cardio.log||[]).push({tipo:A.cardio.tipo,local:A.cardio.local,int:A.cardio.int,sec:Math.round(ms/1000),at:Date.now()});save();return m}
const sg=(it,pv)=>{const x=sug(it,pv);return x?`<small>Sugestão: ${x}</small>`:''};

/* ---------- Calendário, cardio, metas e relatórios ---------- */
const MN=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'],WD=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const dk=d=>{d=new Date(d);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const mk=d=>d.getFullYear()+'-'+p2(d.getMonth()+1);

const IX=()=>{const m={};for(const s of S.sessions){const k=dk(s.start),o=m[k]=m[k]||{n:0,g:0,c:0};o.n++;o.g+=(s.end-s.start)/6e4;o.c+=num(s.cardio&&s.cardio.min)}return m};
const cardio=(k,m)=>k in S.cl?num(S.cl[k]):(m[k]?m[k].c:0);
function dstat(d,m){const t=D0(d).getTime(),T=D0(Date.now()).getTime();if(t<S.trk)return'nt';
if(m[dk(d)]&&m[dk(d)].n)return'ok';if(!(S.plan[d.getDay()]||[]).length)return'rest';return t<T?'miss':'pend'}
function wk(ms,m){m=m||IX();const T=D0(Date.now()),days=[];let tr=0,sch=0,miss=0,gym=0,cd=0,cmb=0,ls=null;
for(let i=0;i<7;i++){const d=addD(ms,i),k=dk(d),s=dstat(d,m),o=m[k]||{n:0,g:0,c:0},c=cardio(k,m);
days.push({d,s,c});if(o.n)tr++;if(s==='miss')miss++;if((S.plan[d.getDay()]||[]).length){ls=d;if(D0(d)>=S.trk)sch++}
gym+=o.g;cd+=c;cmb+=o.g+c-Math.min(c,o.c,o.g)}
const lk=ls&&m[dk(ls)],closed=!!(T>addD(ms,6)||(ls&&(T>ls||(lk&&lk.n>0)))),gl=S.goals[mk(addD(ms,3))];
return{ms,days,tr,sch,miss,gym,cd,cmb,closed,gl,met:gl!=null&&cd>=gl,short:gl!=null?Math.max(0,gl-cd):0}}
function streaks(){const m=IX(),T=D0(Date.now());let run=0,best=0,r=0,rb=0,g=0,gb=0;
for(let d=new Date(S.trk);d<=T;d=addD(d,1)){const s=dstat(d,m);if(s==='ok'){run++;best=Math.max(best,run)}else if(s==='miss')run=0}
for(let w=mon(S.trk);w<=T;w=addD(w,7)){const x=wk(w,m);

function mgrid(y,mo,m,n){const lead=(new Date(y,mo,1).getDay()+6)%7,N=new Date(y,mo+1,0).getDate();let h='<div class="cg'+(n?'':' mini')+'">'+'<span></span>'.repeat(lead);for(let i=1;i<=N;i++)h+=cell(new Date(y,mo,i),m,n);return h+'</div>'}
const nv=(a,t)=>`<div class="row nav"><button class="ghost" data-a="${a}" data-v="-1">‹</button><b class="ctr">${t}</b><button class="ghost" data-a="${a}" data-v="1">›</button></div>`;

function calSem(m){const ms=addD(mon(Date.now()),wOff*7),w=wk(ms,m),pm=addD(ms,-7),pv=pm>=mon(S.trk)?wk(pm,m):null,cd=cdd||dk(Date.now());

function calMes(m){const f=new Date(new Date().getFullYear(),new Date().getMonth()+mOff,1),y=f.getFullYear(),mo=f.getMonth(),key=mk(f),gl=S.goals[key],L=new Date(y,mo+1,0);

for(let d=new Date(f);d<=L;d=addD(d,1)){const s=dstat(d,m);if(s==='ok')t++;if(s==='miss')fa++}
for(let w=mon(f);w<=L;w=addD(w,7)){if(mk(addD(w,3))!==key||addD(w,6)<S.trk)continue;const x=wk(w,m);tot+=x.cd;

function chart(P){
